# GitHub secret scanning allowlist for intentionally public local-development placeholders.
# These values are only used in local Docker Compose and demo fixtures; real secrets
# must be supplied via environment variables or a secret store in production.
paths-ignore:
  - "infra/compose.yaml"
  - "infra/compose.demo.yaml"
  - "infra/compose.staging.yaml"
  - ".env.example"
  - ".env.demo.example"
  - "scripts/create_test_token.py"
  - "apps/api/tests/**"
