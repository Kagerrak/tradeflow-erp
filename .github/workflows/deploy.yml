name: Deploy demo

# CD pipeline: build images -> push to ECR -> pull and run on the demo EC2.
# AWS auth uses OIDC (no long-lived keys); the EC2 pulls with its instance role.

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "infra/compose*.yaml"
      - "infra/Caddyfile"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-southeast-2
  CUSTOMER: demo

jobs:
  build:
    name: Build & push images
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [api, worker, web]
    outputs:
      registry: ${{ steps.login-ecr.outputs.registry }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::527673188999:role/tradeflow-demo-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Compute image tag
        id: meta
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.image }}/Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/tradeflow-demo-${{ matrix.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.login-ecr.outputs.registry }}/tradeflow-demo-${{ matrix.image }}:latest
          cache-from: type=gha,scope=demo-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=demo-${{ matrix.image }}

  deploy:
    name: Deploy to demo EC2
    needs: build
    runs-on: ubuntu-latest
    env:
      ECR_REGISTRY: ${{ needs.build.outputs.registry }}
      IMAGE_TAG: ${{ needs.build.outputs.tag }}
      INSTANCE_NAME: tradeflow-demo
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::527673188999:role/tradeflow-demo-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Send deploy command via SSM
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=$INSTANCE_NAME" "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)
          [ -n "$INSTANCE_ID" ] && [ "$INSTANCE_ID" != "None" ] || { echo "instance $INSTANCE_NAME not found"; exit 1; }

          # One self-contained shell script: decode the compose files and the
          # deploy script into /opt/tradeflow, then run the deploy.
          PAYLOAD=$(mktemp)
          {
            echo "set -e"
            echo "sudo mkdir -p /opt/tradeflow && cd /opt/tradeflow"
            for f in infra/compose.demo.yaml infra/compose.deploy.yaml infra/Caddyfile infra/scripts/deploy-on-box.sh; do
              echo "echo '$(base64 -w0 "$f")' | base64 -d | sudo tee $(basename "$f") >/dev/null"
            done
            echo "sudo chmod +x deploy-on-box.sh"
            echo "sudo ECR_REGISTRY=$ECR_REGISTRY IMAGE_TAG=$IMAGE_TAG CUSTOMER=$CUSTOMER bash deploy-on-box.sh"
          } >"$PAYLOAD"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "tradeflow demo deploy $IMAGE_TAG" \
            --parameters "{\"commands\": [$(jq -Rs . <"$PAYLOAD")]}" \
            --query Command.CommandId --output text)
          echo "SSM command: $COMMAND_ID on $INSTANCE_ID"

          for attempt in $(seq 1 90); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 10
          done
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text
          [ "$STATUS" = Success ] || { echo "deploy failed with status $STATUS"; exit 1; }
