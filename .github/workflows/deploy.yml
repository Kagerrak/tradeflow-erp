name: Deploy demo

# Serverless demo pipeline: build the three Lambda images, publish the Next.js
# static assets to the private S3 origin, then apply the CloudFormation stacks
# and run migrations, demo rebuild and endpoint verification as separate steps.
#
# AWS access uses GitHub OIDC only — there are no long-lived AWS keys in GitHub.

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "infra/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      image_tag:
        description: Existing image tag to redeploy (leave empty to build this commit)
        required: false
        type: string

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-southeast-2
  PROJECT_NAME: tradeflow-demo
  DEPLOY_ROLE: arn:aws:iam::527673188999:role/tradeflow-demo-deploy

jobs:
  build:
    name: Build & push ${{ matrix.image }} image
    runs-on: ubuntu-latest
    if: inputs.image_tag == ''
    strategy:
      fail-fast: false
      matrix:
        image: [api, worker, web]
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.image }}/Dockerfile.lambda
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.PROJECT_NAME }}-${{ matrix.image }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.PROJECT_NAME }}-${{ matrix.image }}:latest
          cache-from: type=gha,scope=lambda-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=lambda-${{ matrix.image }}

      - name: Publish Next.js static assets to the private S3 origin
        if: matrix.image == 'web'
        env:
          IMAGE: ${{ steps.login-ecr.outputs.registry }}/${{ env.PROJECT_NAME }}-web:${{ github.sha }}
        run: |
          set -euo pipefail
          BUCKET="${PROJECT_NAME}-web-$(aws sts get-caller-identity --query Account --output text)-${AWS_REGION}"
          CONTAINER="$(docker create "$IMAGE")"
          mkdir -p .static-dist
          docker cp "$CONTAINER:/app/apps/web/.next/static" .static-dist/static
          docker cp "$CONTAINER:/app/apps/web/public" .static-dist/public
          docker rm "$CONTAINER" >/dev/null
          aws s3 sync .static-dist/static "s3://$BUCKET/_next/static" \
            --delete --cache-control "public, max-age=31536000, immutable"
          aws s3 sync .static-dist/public "s3://$BUCKET" \
            --delete --cache-control "public, max-age=3600"
          rm -rf .static-dist

  deploy:
    name: Deploy infrastructure and application
    runs-on: ubuntu-latest
    needs: [build]
    if: always() && (needs.build.result == 'success' || inputs.image_tag != '')
    env:
      IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy serverless demo
        run: ./infra/scripts/deploy-serverless.sh

  verify:
    name: Verify public endpoints
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Smoke test the deployed demo
        run: |
          set -euo pipefail
          DOMAIN="$(aws cloudformation describe-stacks --region "$AWS_REGION" \
            --stack-name "${PROJECT_NAME}-app" \
            --query "Stacks[0].Outputs[?OutputKey=='DistributionDomainName'].OutputValue" \
            --output text)"
          echo "public url: https://$DOMAIN"
          curl -fsS --max-time 30 "https://$DOMAIN/api/health" >/dev/null
          curl -fsS --max-time 30 "https://$DOMAIN/api/demo/status" | head -c 400
          echo
          curl -fsS --max-time 30 "https://$DOMAIN/" >/dev/null
          echo "smoke test passed"

      - name: Report Aurora capacity
        if: always()
        run: |
          aws cloudwatch get-metric-statistics --region "$AWS_REGION" \
            --namespace AWS/RDS --metric-name ServerlessDatabaseCapacity \
            --dimensions Name=DBClusterIdentifier,Value="${PROJECT_NAME}-aurora" \
            --start-time "$(date -u -d '1 hour ago' +%Y-%m-%dT%H:%M:%SZ)" \
            --end-time "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --period 300 --statistics Average --query 'Datapoints[].Average' || true
