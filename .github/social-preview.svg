<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7f9fc"/>
      <stop offset="100%" stop-color="#eef2f7"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0d1b33" flood-opacity="0.08"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#d1d9e6" opacity="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>

  <!-- Accent shape -->
  <circle cx="1180" cy="80" r="240" fill="#175cd3" opacity="0.06"/>
  <circle cx="1080" cy="600" r="180" fill="#2d7ff9" opacity="0.05"/>

  <!-- Logo mark -->
  <g transform="translate(96, 96)">
    <rect width="112" height="112" rx="24" fill="#175cd3"/>
    <text x="56" y="74" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="54" font-weight="700" fill="white" text-anchor="middle">TF</text>
  </g>

  <!-- Headline -->
  <text x="96" y="292" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="92" font-weight="750" fill="#10182b" letter-spacing="-0.045em">TradeFlow ERP</text>

  <!-- Tagline -->
  <text x="96" y="364" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="38" font-weight="450" fill="#2d415e">Distribution operations with authority, traceability, and control.</text>

  <!-- Accent line -->
  <rect x="96" y="420" width="120" height="6" rx="3" fill="#175cd3"/>

  <!-- Stack line -->
  <text x="96" y="484" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="500" fill="#667c9c" letter-spacing="0.02em">Next.js · Expo · FastAPI · PostgreSQL · Apache-2.0</text>

  <!-- Dashboard mockup card -->
  <g transform="translate(720, 112)" filter="url(#softShadow)">
    <rect width="464" height="416" rx="20" fill="#ffffff" stroke="#dbe4f0" stroke-width="1.5"/>

    <!-- Window chrome -->
    <circle cx="32" cy="32" r="6" fill="#ef4444"/>
    <circle cx="52" cy="32" r="6" fill="#f59e0b"/>
    <circle cx="72" cy="32" r="6" fill="#22c55e"/>

    <!-- Module tabs -->
    <rect x="32" y="58" width="56" height="24" rx="6" fill="#175cd3" opacity="0.1"/>
    <rect x="96" y="58" width="56" height="24" rx="6" fill="#eef2f7"/>
    <rect x="160" y="58" width="56" height="24" rx="6" fill="#eef2f7"/>
    <rect x="224" y="58" width="56" height="24" rx="6" fill="#eef2f7"/>

    <!-- Metrics row -->
    <rect x="32" y="104" width="124" height="80" rx="10" fill="#f7f9fc" stroke="#e6edf5" stroke-width="1"/>
    <rect x="40" y="118" width="48" height="8" rx="4" fill="#9ba6b5"/>
    <text x="40" y="158" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#10182b">1,248</text>
    <text x="40" y="176" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="500" fill="#22c55e">▲ 12%</text>

    <rect x="170" y="104" width="124" height="80" rx="10" fill="#f7f9fc" stroke="#e6edf5" stroke-width="1"/>
    <rect x="178" y="118" width="48" height="8" rx="4" fill="#9ba6b5"/>
    <text x="178" y="158" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#10182b">₱4.2M</text>
    <text x="178" y="176" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="500" fill="#22c55e">▲ 8%</text>

    <rect x="308" y="104" width="124" height="80" rx="10" fill="#f7f9fc" stroke="#e6edf5" stroke-width="1"/>
    <rect x="316" y="118" width="48" height="8" rx="4" fill="#9ba6b5"/>
    <text x="316" y="158" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#10182b">96.4%</text>
    <text x="316" y="176" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="500" fill="#22c55e">▲ 3%</text>

    <!-- Chart area -->
    <rect x="32" y="200" width="260" height="160" rx="10" fill="#f7f9fc" stroke="#e6edf5" stroke-width="1"/>
    <rect x="48" y="216" width="80" height="8" rx="4" fill="#9ba6b5"/>
    <polyline points="48,320 88,296 128,304 168,272 208,280 248,252" fill="none" stroke="#175cd3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="248" cy="252" r="5" fill="#175cd3"/>

    <!-- List area -->
    <rect x="308" y="200" width="124" height="160" rx="10" fill="#f7f9fc" stroke="#e6edf5" stroke-width="1"/>
    <rect x="320" y="216" width="64" height="8" rx="4" fill="#9ba6b5"/>
    <rect x="320" y="244" width="100" height="8" rx="4" fill="#dbe4f0"/>
    <rect x="320" y="268" width="88" height="8" rx="4" fill="#dbe4f0"/>
    <rect x="320" y="292" width="96" height="8" rx="4" fill="#dbe4f0"/>
    <rect x="320" y="316" width="72" height="8" rx="4" fill="#dbe4f0"/>
  </g>
</svg>
