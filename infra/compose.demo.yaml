name: tradeflow-demo

services:
  postgres:
    image: postgres@sha256:f8e2cc2a36ddb8700e639570f0bc70d0c1495951ba61df903a015dc87db07d02
    environment:
      POSTGRES_DB: tradeflow_demo
      POSTGRES_PASSWORD: ${TRADEFLOW_DEMO_DATABASE_PASSWORD:?required}
      POSTGRES_USER: tradeflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradeflow -d tradeflow_demo"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes: [demo-postgres:/var/lib/postgresql/data]
    deploy:
      resources:
        limits: { cpus: "1", memory: 1G }

  redis:
    image: redis@sha256:8096655e437712b07503796fb64d81359256cfcff0ab29d95a7da72863786efb
    command:
      [
        "redis-server",
        "--maxmemory",
        "128mb",
        "--maxmemory-policy",
        "allkeys-lru",
      ]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  object-storage:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data
    environment:
      MINIO_ROOT_USER: tradeflow
      MINIO_ROOT_PASSWORD: ${TRADEFLOW_DEMO_DATABASE_PASSWORD:?required}
    volumes: [demo-objects:/data]

  api:
    build: { context: .., dockerfile: apps/api/Dockerfile }
    environment: &api-environment
      TRADEFLOW_ENVIRONMENT: demo
      TRADEFLOW_DEMO_MODE: "true"
      TRADEFLOW_DEMO_DATABASE_NAME: tradeflow_demo
      TRADEFLOW_DEMO_SEED_VERSION: "2026.08.24.2"
      TRADEFLOW_DEMO_STATE_PATH: /demo-state/status.json
      TRADEFLOW_DEMO_RESET_TOKEN: ${TRADEFLOW_DEMO_RESET_TOKEN:?required}
      TRADEFLOW_DEMO_WEB_UID: "10001"
      TRADEFLOW_DATABASE_URL: postgresql+asyncpg://tradeflow:${TRADEFLOW_DEMO_DATABASE_PASSWORD}@postgres:5432/tradeflow_demo
      TRADEFLOW_AUTH_ISSUER: ${TRADEFLOW_AUTH_ISSUER:?required}
      TRADEFLOW_AUTH_AUDIENCE: tradeflow-api
      TRADEFLOW_AUTH_TEST_SECRET: ${TRADEFLOW_AUTH_TEST_SECRET:?required}
      TRADEFLOW_OBJECT_STORAGE_ENDPOINT_URL: http://object-storage:9000
      TRADEFLOW_OBJECT_STORAGE_PUBLIC_ENDPOINT_URL: http://object-storage:9000
      TRADEFLOW_OBJECT_STORAGE_ACCESS_KEY: tradeflow
      TRADEFLOW_OBJECT_STORAGE_SECRET_KEY: ${TRADEFLOW_DEMO_DATABASE_PASSWORD}
      TRADEFLOW_OBJECT_STORAGE_BUCKET: tradeflow-demo-evidence
      TRADEFLOW_RATE_LIMIT_REQUESTS_PER_MINUTE: "3000"
      TRADEFLOW_TELEMETRY_ENABLED: "true"
      TRADEFLOW_OTLP_ENDPOINT: ${TRADEFLOW_OTLP_ENDPOINT:-}
    depends_on:
      postgres: { condition: service_healthy }
      object-storage: { condition: service_started }
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits: { cpus: "1", memory: 768M }
    volumes: [demo-state:/demo-state:ro]

  worker:
    build: { context: .., dockerfile: apps/worker/Dockerfile }
    environment:
      TRADEFLOW_WORKER_ENVIRONMENT: demo
      TRADEFLOW_WORKER_DATABASE_URL: postgresql+asyncpg://tradeflow:${TRADEFLOW_DEMO_DATABASE_PASSWORD}@postgres:5432/tradeflow_demo
      TRADEFLOW_WORKER_REDIS_URL: redis://redis:6379/0
      TRADEFLOW_WORKER_OBJECT_STORAGE_ENDPOINT_URL: http://object-storage:9000
      TRADEFLOW_WORKER_OBJECT_STORAGE_PUBLIC_ENDPOINT_URL: http://object-storage:9000
      TRADEFLOW_WORKER_OBJECT_STORAGE_ACCESS_KEY: tradeflow
      TRADEFLOW_WORKER_OBJECT_STORAGE_SECRET_KEY: ${TRADEFLOW_DEMO_DATABASE_PASSWORD}
      TRADEFLOW_WORKER_OBJECT_STORAGE_BUCKET: tradeflow-demo-evidence
      TRADEFLOW_WORKER_TELEMETRY_ENABLED: "true"
      TRADEFLOW_WORKER_OTLP_ENDPOINT: ${TRADEFLOW_OTLP_ENDPOINT:-}
    depends_on:
      {
        postgres: { condition: service_healthy },
        redis: { condition: service_healthy },
      }

  reset:
    build: { context: .., dockerfile: apps/api/Dockerfile }
    command:
      [
        "sh",
        "-c",
        "while true; do python scripts/reset_demo.py; sleep 2700; done",
      ]
    environment:
      <<: *api-environment
      TRADEFLOW_DEMO_API_URL: http://api:8000
      TRADEFLOW_DEMO_STATE_DIR: /demo-state
      TRADEFLOW_DEMO_STATE_PATH: /demo-state/status.json
    depends_on: { api: { condition: service_healthy } }
    volumes: [demo-state:/demo-state]
    restart: unless-stopped

  web:
    build: { context: .., dockerfile: apps/web/Dockerfile }
    environment:
      TRADEFLOW_ENVIRONMENT: demo
      TRADEFLOW_DEMO_MODE: enabled
      TRADEFLOW_DATABASE_NAME: tradeflow_demo
      TRADEFLOW_API_URL: http://api:8000
      TRADEFLOW_DEMO_CREDENTIAL_FILE: /demo-state/credential
      TRADEFLOW_DEMO_STATE_DIR: /demo-state
      TRADEFLOW_PUBLIC_URL: ${TRADEFLOW_PUBLIC_URL:?required}
    depends_on:
      {
        api: { condition: service_healthy },
        reset: { condition: service_started },
      }
    ports: ["${TRADEFLOW_WEB_PORT:-3000}:3000"]
    volumes: [demo-state:/demo-state:ro]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/demo').then(r=>{if(!r.ok)process.exit(1)})",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits: { cpus: "1", memory: 512M }

volumes:
  demo-objects:
  demo-postgres:
  demo-state:
