AWSTemplateFormatVersion: "2010-09-09"
Description: >
  TradeFlow demo data tier: Aurora PostgreSQL Serverless v2 that scales to zero,
  private S3 buckets for static assets, evidence and job markers, an on-demand
  DynamoDB table for demo coordination, and the SQS work queue with its
  dead-letter queue.

Parameters:
  ProjectName:
    Type: String
    Default: tradeflow-demo
  VpcId:
    Type: AWS::EC2::VPC::Id
  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
  DatabaseSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
  DatabaseName:
    Type: String
    Default: tradeflow_demo
  DatabaseUser:
    Type: String
    Default: tradeflow
  DatabasePasswordParameter:
    Type: String
    Default: /tradeflow/demo/database-password
    Description: >
      SSM SecureString holding the Aurora master password. It is read through a
      CloudFormation dynamic reference, so the value is never stored in this
      template, in stack metadata or in any API response.
  AuroraEngineVersion:
    Type: String
    Default: "17.9"
    Description: Must be an aurora-postgresql version that supports 0 ACU.
  AuroraMaxAcu:
    Type: Number
    Default: 2
    MinValue: 0.5
    MaxValue: 16
  AutoPauseSeconds:
    Type: Number
    Default: 300
    MinValue: 300
    MaxValue: 86400
  BackupRetentionDays:
    Type: Number
    Default: 7
    MinValue: 1
    MaxValue: 35

Resources:
  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Private subnets for the TradeFlow demo cluster.
      SubnetIds: !Ref PrivateSubnetIds
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-db"

  DbCluster:
    Type: AWS::RDS::DBCluster
    # Persistent data: never replaced or deleted by a stack update.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      DBClusterIdentifier: !Sub "${ProjectName}-aurora"
      Engine: aurora-postgresql
      EngineVersion: !Ref AuroraEngineVersion
      DatabaseName: !Ref DatabaseName
      MasterUsername: !Ref DatabaseUser
      MasterUserPassword: !Sub "{{resolve:ssm-secure:${DatabasePasswordParameter}}}"
      DBSubnetGroupName: !Ref DbSubnetGroup
      VpcSecurityGroupIds:
        - !Ref DatabaseSecurityGroupId
      # 0 ACU plus a 300 second auto-pause is what makes an idle demo free of
      # database compute charges. RDS Proxy is deliberately not used: it holds a
      # connection open and would prevent the cluster from ever pausing.
      ServerlessV2ScalingConfiguration:
        MinCapacity: 0
        MaxCapacity: !Ref AuroraMaxAcu
        SecondsUntilAutoPause: !Ref AutoPauseSeconds
      # The application speaks the PostgreSQL wire protocol through SQLAlchemy
      # and asyncpg. The RDS Data API is an HTTP API and is not a drop-in
      # replacement for that driver, so it stays disabled.
      EnableHttpEndpoint: false
      StorageEncrypted: true
      BackupRetentionPeriod: !Ref BackupRetentionDays
      DeletionProtection: true
      CopyTagsToSnapshot: false
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-aurora"

  DbInstance:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      DBInstanceIdentifier: !Sub "${ProjectName}-aurora-1"
      DBClusterIdentifier: !Ref DbCluster
      Engine: aurora-postgresql
      DBInstanceClass: db.serverless
      PubliclyAccessible: false
      AutoMinorVersionUpgrade: true
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-aurora-1"

  WebAssetsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "${ProjectName}-web-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-static-builds
            Status: Enabled
            ExpirationInDays: 90
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 3

  DocumentsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "${ProjectName}-documents-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [GET, PUT, HEAD]
            AllowedOrigins: ["*"]
            AllowedHeaders: ["*"]
            ExposedHeaders: [ETag]
            MaxAge: 3000
      LifecycleConfiguration:
        Rules:
          - Id: abort-incomplete-evidence-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7

  ArtifactsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "${ProjectName}-artifacts-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: expire-job-markers
            Status: Enabled
            Prefix: jobs/
            ExpirationInDays: 14
      NotificationConfiguration:
        QueueConfigurations:
          - Event: "s3:ObjectCreated:*"
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: jobs/
            Queue: !GetAtt JobsQueue.Arn

  CoordinationTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${ProjectName}-coordination"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      SSESpecification:
        SSEEnabled: true

  JobsDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${ProjectName}-jobs-dlq"
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  JobsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${ProjectName}-jobs"
      # Must exceed the worker Lambda timeout so a long demo rebuild is never
      # redelivered while it is still running.
      VisibilityTimeout: 960
      MessageRetentionPeriod: 1209600
      ReceiveMessageWaitTimeSeconds: 20
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt JobsDeadLetterQueue.Arn
        maxReceiveCount: 5

  JobsQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref JobsQueue
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowS3JobMarkers
            Effect: Allow
            Principal:
              Service: s3.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt JobsQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !Sub "arn:aws:s3:::${ProjectName}-artifacts-${AWS::AccountId}-${AWS::Region}"

Outputs:
  DbClusterEndpoint:
    Value: !GetAtt DbCluster.Endpoint.Address
    Export:
      Name: !Sub "${AWS::StackName}-DbClusterEndpoint"
  DbClusterPort:
    Value: !GetAtt DbCluster.Endpoint.Port
    Export:
      Name: !Sub "${AWS::StackName}-DbClusterPort"
  WebAssetsBucketName:
    Value: !Ref WebAssetsBucket
    Export:
      Name: !Sub "${AWS::StackName}-WebAssetsBucketName"
  DocumentsBucketName:
    Value: !Ref DocumentsBucket
    Export:
      Name: !Sub "${AWS::StackName}-DocumentsBucketName"
  ArtifactsBucketName:
    Value: !Ref ArtifactsBucket
    Export:
      Name: !Sub "${AWS::StackName}-ArtifactsBucketName"
  CoordinationTableName:
    Value: !Ref CoordinationTable
    Export:
      Name: !Sub "${AWS::StackName}-CoordinationTableName"
  JobsQueueUrl:
    Value: !Ref JobsQueue
    Export:
      Name: !Sub "${AWS::StackName}-JobsQueueUrl"
  JobsQueueArn:
    Value: !GetAtt JobsQueue.Arn
    Export:
      Name: !Sub "${AWS::StackName}-JobsQueueArn"
  JobsDeadLetterQueueUrl:
    Value: !Ref JobsDeadLetterQueue
    Export:
      Name: !Sub "${AWS::StackName}-JobsDeadLetterQueueUrl"
