[project]
name = "tradeflow-worker"
version = "0.1.0"
description = "TradeFlow ERP background workers"
requires-python = ">=3.13,<3.14"
dependencies = [
  "arq>=0.26.3",
  "opentelemetry-api>=1.36.0",
  "pydantic-settings>=2.10.1",
  "redis[hiredis]>=5.2.1,<6",
  "structlog>=25.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tradeflow_worker"]
