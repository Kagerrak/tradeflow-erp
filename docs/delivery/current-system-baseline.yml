      - metric: correction_rate_percent
        baseline: 5.0
        source: approved_masked_observation

  - id: HF-DEL-001
    name: Record proof of delivery
    owner: Delivery supervisor
    sampling_window: 2 weeks, n>=50
    metrics:
      - metric: task_time_minutes
        baseline: 2.0
        source: approved_masked_observation
      - metric: exception_rate_percent
        baseline: 2.0
        source: approved_masked_observation

  - id: HF-PAY-001
    name: Allocate payment to invoices
    owner: Finance manager
    sampling_window: 2 weeks, n>=50
    metrics:
      - metric: task_time_minutes
        baseline: 3.0
        source: approved_masked_observation
      - metric: unmatched_rate_percent
        baseline: 3.0
        source: approved_masked_observation

  - id: HF-RET-001
    name: Process customer return
    owner: Returns lead
    sampling_window: 4 weeks, n>=20
    metrics:
      - metric: cycle_time_hours
        baseline: 24.0
        source: approved_masked_observation
      - metric: correction_rate_percent
        baseline: 10.0
        source: approved_masked_observation

success_measures:
  - id: SM-ORDER-001
    name: Order-entry time and correction rate
    source: Web order-entry workspace telemetry and order audit log
    formula: Median minutes from new-order to submitted; corrections per 100 submitted orders
    window: Weekly
    baseline: "5 min / 5% (current-system baseline, approved observation window)"
    target: "<= 4 min median and <= 2% correction rate"
    owner: Sales operations
    missing_data_behavior: Distinguish no-orders from zero-time; report NULL for missing window

  - id: SM-STOCK-001
    name: Stock variance and reservation conflicts
    source: Inventory projection, reservation events, and adjustment log
    formula: Count of variance exceptions + count of concurrent-reservation conflicts per week
    window: Weekly
    baseline: "Current-system baseline TBD during observation window"
    target: Zero unexplained variances; conflicts resolved without balance edits
    owner: Warehouse lead
    missing_data_behavior: Missing source treated as unknown, not zero

  - id: SM-DEL-001
    name: Delivery completion and exception resolution time
    source: Delivery confirmation events and exception records
    formula: Percentage of deliveries completed same day; median exception resolution hours
    window: Weekly
    baseline: "95% same-day completion / 4 hr exception resolution (current-system baseline)"
    target: ">= 98% same-day; <= 2 hr exception resolution"
    owner: Delivery supervisor
    missing_data_behavior: Missing confirmation treated as incomplete, not completed

  - id: SM-PAY-001
    name: Unallocated payment age and statement reconciliation
    source: payment_receipt_balances, payment_allocations, customer_ledger_entries
    formula: Max age in days of unapplied cleared receipts; statement-to-ledger variance
    window: Daily
    baseline: "<= 7 days / zero variance (post #116 baseline)"
    target: "<= 3 days / zero variance"
    owner: Finance manager
    missing_data_behavior: Missing receipt balance treated as unknown; zero unapplied is explicit

  - id: SM-RET-001
    name: Return cycle time and damaged-stock visibility
    source: Return authorization, inspection, and quarantine records
    formula: Median hours from request to disposition; percentage of damaged stock visible in quarantine
    window: Weekly
    baseline: "24 hr / 100% visible (current-system baseline)"
    target: "<= 12 hr / 100% visible"
    owner: Returns lead
    missing_data_behavior: No return record treated as no returns, not zero cycle time

  - id: SM-PUR-001
    name: Purchase lead time and receipt variance
    source: Purchase orders and goods receipt events
    formula: Median days PO to receipt; count and value of receipt variances
    window: Weekly
    baseline: "Current-system baseline TBD during observation window"
    target: "Within current-system baseline; variances <= 1% of receipt value"
    owner: Procurement lead
    missing_data_behavior: Missing PO/receipt treated as unknown

  - id: SM-EXP-001
    name: Expense approval time
    source: Expense claim events
    formula: Median hours from claim submission to approval/posting
    window: Weekly
    baseline: "48 hr (current-system baseline)"
    target: "<= 24 hr"
    owner: Finance lead
    missing_data_behavior: No claims treated as no data, not zero

  - id: SM-COMM-001
    name: Commission dispute/recalculation rate
    source: Commission accrual, adjustment, and reversal events
    formula: Disputes and recalculations per 100 payouts
    window: Monthly
    baseline: "Current-system baseline TBD during observation window"
    target: "<= 2%"
    owner: Finance lead
    missing_data_behavior: Missing commission data treated as unknown

  - id: SM-MOB-001
    name: Mobile crash-free sessions and sync success
    source: Mobile telemetry and outbox completion
    formula: Crash-free session percentage; outbox commands completed / commands queued
    window: Daily
    baseline: ">= 99% crash-free / >= 99% sync success (target baseline)"
    target: ">= 99.5% crash-free / >= 99.5% sync success"
    owner: Mobile/platform lead
    missing_data_behavior: Missing telemetry treated as unknown, not 100%

  - id: SM-UAT-001
    name: User task completion compared with current system
    source: UAT task scripts and timed observation
    formula: Percentage of UAT tasks completed without assist; median time vs current-system baseline
    window: Per UAT cycle
    baseline: "Current-system baseline from high-frequency workflow observations"
    target: ">= 95% unassisted and non-inferior task time"
    owner: Release steering committee
    missing_data_behavior: Missing UAT result blocks #103 go decision

