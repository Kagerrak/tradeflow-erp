# Current-system baseline and first-release success-measure definitions
# Issue: https://github.com/Kagerrak/tradeflow-erp/issues/110
# This file is validated by apps/api/tests/test_current_system_baseline.py.

baseline_version: "2026-08-19"
issue: 110
branch: feature/baseline-current-workflows
base_commit: "771c0616470f032dba76f52fc27b42b3d36a0442"

classifications:
  implemented_and_verified:
    description: >
      The capability is implemented in TradeFlow and qualified by tests,
      generated clients, CI gates, and/or an independent review.
    required_fields:
      - evidence
      - verified_by
  retired_with_approval:
    description: >
      The current-system capability is intentionally not replaced. The named
      business owner has approved the retirement with a recorded reason.
    required_fields:
      - approving_owner
      - approval_date
      - reason
  temporary_bridge:
    description: >
      The capability is handled outside TradeFlow until a future slice removes
      the bridge. The bridge has an owner, documented risks, controls, removal
      date, and migration path.
    required_fields:
      - bridge_owner
      - risks
      - controls
      - removal_date
      - migration_path

